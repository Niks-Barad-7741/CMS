<div class="auth-container">
  <div class="auth-box">
    <h2>Register</h2>
    <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>
    
    <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
      <div class="form-group">
        <label for="name">Name</label>
        <input 
          type="text" 
          id="name" 
          name="name" 
          [(ngModel)]="userData.name" 
          #name="ngModel"
          [ngClass]="{ 'is-invalid': name.invalid && (name.dirty || name.touched) }"
          required
          minlength="2">
        <div *ngIf="name.invalid && (name.dirty || name.touched)" class="validation-error">
          <small *ngIf="name.errors?.['required']">Name is required.</small>
          <small *ngIf="name.errors?.['minlength']">Name must be at least 2 characters long.</small>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="userData.email" 
          #email="ngModel"
          [ngClass]="{ 'is-invalid': email.invalid && (email.dirty || email.touched) }"
          required
          email>
        <div *ngIf="email.invalid && (email.dirty || email.touched)" class="validation-error">
          <small *ngIf="email.errors?.['required']">Email is required.</small>
          <small *ngIf="email.errors?.['email']">Please enter a valid email address.</small>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="userData.password" 
          #password="ngModel"
          [ngClass]="{ 'is-invalid': password.invalid && (password.dirty || password.touched) }"
          required
          minlength="8">
        <div *ngIf="password.invalid && (password.dirty || password.touched)" class="validation-error">
          <small *ngIf="password.errors?.['required']">Password is required.</small>
          <small *ngIf="password.errors?.['minlength']">Password must be at least 8 characters long.</small>
        </div>
      </div>

      <button type="submit" [disabled]="!registerForm.valid">Register</button>
    </form>
    
    <div class="auth-links">
      <p>Already have an account? <a routerLink="/login">Login here</a></p>
    </div>
  </div>
</div>
