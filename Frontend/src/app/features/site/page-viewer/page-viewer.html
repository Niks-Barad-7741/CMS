<div *ngIf="isLoading" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
  <div class="animate-pulse">
    <div class="h-10 bg-gray-200 rounded w-1/3 mb-8"></div>
    <div class="h-4 bg-gray-200 rounded w-full mb-4"></div>
    <div class="h-4 bg-gray-200 rounded w-5/6 mb-4"></div>
    <div class="h-4 bg-gray-200 rounded w-4/6"></div>
  </div>
</div>

<!-- Empty / Not Published State -->
<div *ngIf="hasError" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
  <div class="py-20 text-center max-w-xl mx-auto">
    <div class="w-20 h-20 bg-indigo-50 text-indigo-500 rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-sm">
      <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
      </svg>
    </div>
    <h3 class="text-2xl font-bold text-gray-900 mb-2">No Content Published Yet</h3>
    <p class="text-gray-500 text-base leading-relaxed mb-6">
      Content for this page (<b>{{ pageSlug }}</b>) has not been saved or published by the organization admin yet.
    </p>
  </div>
</div>

<!-- Success State -->
<div *ngIf="!isLoading && !hasError && pageContent">
  <!-- Render the Page HTML (full-width for home hero, constrained for others) -->
  <div class="w-full" [class]="isHomePage ? '' : 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12'" [innerHTML]="safeBodyHtml">
  </div>
</div>
