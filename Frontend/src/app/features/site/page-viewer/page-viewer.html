<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
  
  <!-- Loading State -->
  <div *ngIf="isLoading" class="animate-pulse">
    <div class="h-10 bg-gray-200 rounded w-1/3 mb-8"></div>
    <div class="h-4 bg-gray-200 rounded w-full mb-4"></div>
    <div class="h-4 bg-gray-200 rounded w-5/6 mb-4"></div>
    <div class="h-4 bg-gray-200 rounded w-4/6"></div>
  </div>

  <!-- Error State -->
  <div *ngIf="hasError" class="bg-red-50 border-l-4 border-red-400 p-6 rounded">
    <div class="flex">
      <div class="flex-shrink-0">
        <svg class="h-6 w-6 text-red-400" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
        </svg>
      </div>
      <div class="ml-3">
        <h3 class="text-lg font-medium text-red-800">Page not found</h3>
        <p class="mt-2 text-sm text-red-700">
          The page you requested ({{ pageSlug }}) does not exist or has not been published yet.
        </p>
      </div>
    </div>
  </div>

  <!-- Success State -->
  <div *ngIf="!isLoading && !hasError && pageContent">
    <h1 class="text-4xl font-extrabold text-gray-900 mb-8">{{ pageContent.title }}</h1>
    
    <!-- Render the Rich Text HTML -->
    <div class="prose prose-lg prose-indigo max-w-none" [innerHTML]="safeBodyHtml">
    </div>
  </div>

</div>
