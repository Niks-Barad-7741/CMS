<div class="mb-6">
  <h2 class="text-2xl font-bold text-text-primary">Media Library</h2>
  <p class="text-text-muted text-sm">Upload and manage images and assets for your pages.</p>
</div>

<!-- Org Selector (Admin only) -->
<div *ngIf="role === 'Admin'" class="bg-surface-card rounded shadow p-6 mb-6">
  <label class="block text-sm font-medium text-text-secondary">Select Organization</label>
  <select [(ngModel)]="selectedOrgId" (change)="onOrgChange()" class="mt-1 block w-full max-w-md rounded-md border-border-card shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
    <option [ngValue]="null">-- Select Organization --</option>
    <option *ngFor="let org of organizations" [ngValue]="org.id">{{ org.name }}</option>
  </select>
</div>

<!-- Upload & Gallery -->
<div class="bg-surface-card rounded shadow p-6" *ngIf="selectedOrgId">
  
  <!-- Upload Area -->
  <div class="mb-8 p-6 border-2 border-dashed border-border-card rounded-lg text-center bg-surface-base">
    <input type="file" id="file-upload" (change)="onFileSelected($event)" class="hidden" accept="image/*" />
    <label for="file-upload" class="cursor-pointer bg-surface-card px-4 py-2 border border-border-card rounded-md shadow-sm text-sm font-medium text-text-secondary hover:bg-surface-base mb-4 inline-block">
      Select Image
    </label>
    <div *ngIf="selectedFile" class="text-sm text-text-secondary mt-2 mb-4">
      Selected: {{ selectedFile.name }}
    </div>
    <button *ngIf="selectedFile" (click)="uploadFile()" [disabled]="isUploading" class="bg-blue-600 text-white px-6 py-2 rounded shadow hover:bg-blue-700 disabled:bg-blue-300">
      {{ isUploading ? 'Uploading...' : 'Upload File' }}
    </button>
  </div>

  <!-- Gallery Grid -->
  <div>
    <h3 class="text-lg font-semibold text-text-primary mb-4">Library</h3>
    <div *ngIf="mediaFiles.length === 0" class="text-center text-text-muted py-8">
      No media files uploaded yet.
    </div>
    
    <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
      <div *ngFor="let media of mediaFiles" class="border border-border-card rounded overflow-hidden shadow-sm relative group bg-surface-base flex flex-col justify-between">
        
        <div class="h-32 flex items-center justify-center p-2">
          <!-- Quick heuristic to check if it's an image. If so, display thumbnail, otherwise an icon -->
          <img *ngIf="media.fileType.startsWith('image/')" [src]="apiBaseUrl + media.filePath" class="max-h-full max-w-full object-contain">
          <span *ngIf="!media.fileType.startsWith('image/')" class="text-text-muted text-4xl">📄</span>
        </div>
        
        <div class="p-2 bg-surface-card text-xs border-t border-border-card truncate" [title]="media.fileName">
          {{ media.fileName }}
        </div>
        
        <!-- Overlay -->
        <div class="absolute inset-0 bg-black bg-opacity-50 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center space-x-2">
          <button (click)="copyUrl(media.filePath)" class="bg-surface-card text-text-primary px-3 py-1 rounded text-xs font-medium hover:bg-surface-base shadow">
            Copy URL
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<div *ngIf="!selectedOrgId" class="text-center p-12 bg-surface-base rounded border-2 border-dashed border-border-card">
  <p class="text-text-muted">Please select an Organization above to view or upload media.</p>
</div>
