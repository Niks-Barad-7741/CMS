<div class="h-[calc(100vh-64px)] flex flex-col bg-surface-base">
  <!-- Topbar -->
  <div class="h-16 bg-surface-card border-b border-border-card flex items-center justify-between px-6 shrink-0">
    <div class="flex items-center gap-4">
      <button (click)="goBack()" class="p-2 -ml-2 text-text-muted hover:text-text-primary rounded-full hover:bg-surface-base transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
      </button>
      <h1 class="text-xl font-bold text-text-primary flex items-center gap-2">
        <span>Figma Wireframe Builder</span>
        <span class="text-xs bg-surface-base text-text-secondary px-2 py-0.5 rounded-full">BETA</span>
      </h1>
    </div>
    
    <div class="flex items-center gap-3">
      <span *ngIf="saveStatus === 'saved'" class="text-sm font-semibold text-emerald-500 flex items-center gap-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
        Saved Successfully
      </span>
      <span *ngIf="saveStatus === 'error'" class="text-sm font-semibold text-red-600">Error Saving</span>
      
      <button (click)="save()" [disabled]="saveStatus === 'saving'" 
        class="bg-indigo-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-indigo-700 transition-colors flex items-center gap-2 disabled:opacity-70">
        <svg *ngIf="saveStatus !== 'saving'" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
        <svg *ngIf="saveStatus === 'saving'" class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        {{ saveStatus === 'saving' ? 'Saving...' : 'Publish' }}
      </button>
    </div>
  </div>

  <div class="flex-1 flex overflow-hidden">
    <!-- Left Sidebar (Form) -->
    <div class="w-96 bg-surface-card border-r border-border-card flex flex-col h-full z-10 shrink-0">
      <div class="flex-1 overflow-y-auto p-6 space-y-8">
        
        <!-- General -->
        <section>
          <h3 class="text-sm font-bold text-text-primary uppercase tracking-wider mb-4 border-b pb-2">General</h3>
          <div class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-text-muted mb-1">Company / Logo Text</label>
              <input type="text" [(ngModel)]="form.companyName" (ngModelChange)="updatePreviewIframe()" class="w-full text-sm p-2.5 border border-border-card rounded-lg bg-surface-base focus:bg-surface-card focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors">
            </div>
          </div>
        </section>

        <!-- Hero -->
        <section>
          <h3 class="text-sm font-bold text-text-primary uppercase tracking-wider mb-4 border-b pb-2">Hero Section</h3>
          <div class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-text-muted mb-1">Headline</label>
              <input type="text" [(ngModel)]="form.heroHeadline" (ngModelChange)="updatePreviewIframe()" class="w-full text-sm p-2.5 border border-border-card rounded-lg bg-surface-base focus:bg-surface-card focus:border-indigo-500 transition-colors">
            </div>
            <div>
              <label class="block text-xs font-semibold text-text-muted mb-1">Subheadline</label>
              <textarea [(ngModel)]="form.heroSubheadline" (ngModelChange)="updatePreviewIframe()" rows="3" class="w-full text-sm p-2.5 border border-border-card rounded-lg bg-surface-base focus:bg-surface-card focus:border-indigo-500 transition-colors resize-none"></textarea>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-semibold text-text-muted mb-1">Primary Button</label>
                <input type="text" [(ngModel)]="form.heroPrimaryBtn" (ngModelChange)="updatePreviewIframe()" class="w-full text-sm p-2.5 border border-border-card rounded-lg bg-surface-base focus:bg-surface-card focus:border-indigo-500 transition-colors">
              </div>
              <div>
                <label class="block text-xs font-semibold text-text-muted mb-1">Secondary Button</label>
                <input type="text" [(ngModel)]="form.heroSecondaryBtn" (ngModelChange)="updatePreviewIframe()" class="w-full text-sm p-2.5 border border-border-card rounded-lg bg-surface-base focus:bg-surface-card focus:border-indigo-500 transition-colors">
              </div>
            </div>
          </div>
        </section>

        <!-- Features -->
        <section>
          <h3 class="text-sm font-bold text-text-primary uppercase tracking-wider mb-4 border-b pb-2">Features Grid</h3>
          <div class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-text-muted mb-1">Section Title</label>
              <input type="text" [(ngModel)]="form.featureTitle" (ngModelChange)="updatePreviewIframe()" class="w-full text-sm p-2.5 border border-border-card rounded-lg bg-surface-base focus:bg-surface-card focus:border-indigo-500 transition-colors">
            </div>
            <div>
              <label class="block text-xs font-semibold text-text-muted mb-1">Section Subtitle</label>
              <input type="text" [(ngModel)]="form.featureSubtitle" (ngModelChange)="updatePreviewIframe()" class="w-full text-sm p-2.5 border border-border-card rounded-lg bg-surface-base focus:bg-surface-card focus:border-indigo-500 transition-colors">
            </div>
            
            <div class="space-y-3 pt-2">
              <label class="block text-xs font-semibold text-text-muted">Feature Items ({{form.features.length}})</label>
              <div *ngFor="let feat of form.features; let i = index" class="p-3 border border-border-card rounded-lg bg-surface-base relative group">
                <input type="text" [(ngModel)]="feat.title" (ngModelChange)="updatePreviewIframe()" class="w-full text-sm p-2 border border-border-card rounded mb-2 font-bold" placeholder="Title">
                <textarea [(ngModel)]="feat.description" (ngModelChange)="updatePreviewIframe()" rows="2" class="w-full text-sm p-2 border border-border-card rounded resize-none" placeholder="Description"></textarea>
              </div>
            </div>
          </div>
        </section>

        <!-- Content Block -->
        <section>
          <h3 class="text-sm font-bold text-text-primary uppercase tracking-wider mb-4 border-b pb-2">Image & Content</h3>
          <div class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-text-muted mb-1">Heading</label>
              <input type="text" [(ngModel)]="form.contentHeading" (ngModelChange)="updatePreviewIframe()" class="w-full text-sm p-2.5 border border-border-card rounded-lg bg-surface-base focus:bg-surface-card focus:border-indigo-500 transition-colors">
            </div>
            <div>
              <label class="block text-xs font-semibold text-text-muted mb-1">Paragraph 1</label>
              <textarea [(ngModel)]="form.contentBody1" (ngModelChange)="updatePreviewIframe()" rows="3" class="w-full text-sm p-2.5 border border-border-card rounded-lg bg-surface-base focus:bg-surface-card focus:border-indigo-500 transition-colors resize-none"></textarea>
            </div>
            <div>
              <label class="block text-xs font-semibold text-text-muted mb-1">Paragraph 2</label>
              <textarea [(ngModel)]="form.contentBody2" (ngModelChange)="updatePreviewIframe()" rows="3" class="w-full text-sm p-2.5 border border-border-card rounded-lg bg-surface-base focus:bg-surface-card focus:border-indigo-500 transition-colors resize-none"></textarea>
            </div>
            <div>
              <label class="block text-xs font-semibold text-text-muted mb-1">Button Text</label>
              <input type="text" [(ngModel)]="form.contentBtn" (ngModelChange)="updatePreviewIframe()" class="w-full text-sm p-2.5 border border-border-card rounded-lg bg-surface-base focus:bg-surface-card focus:border-indigo-500 transition-colors">
            </div>
          </div>
        </section>
        
        <!-- Footer -->
        <section>
          <h3 class="text-sm font-bold text-text-primary uppercase tracking-wider mb-4 border-b pb-2">Footer</h3>
          <div class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-text-muted mb-1">Address</label>
              <input type="text" [(ngModel)]="form.footerAddress" (ngModelChange)="updatePreviewIframe()" class="w-full text-sm p-2.5 border border-border-card rounded-lg bg-surface-base focus:bg-surface-card focus:border-indigo-500 transition-colors">
            </div>
            <div>
              <label class="block text-xs font-semibold text-text-muted mb-1">Email</label>
              <input type="text" [(ngModel)]="form.footerEmail" (ngModelChange)="updatePreviewIframe()" class="w-full text-sm p-2.5 border border-border-card rounded-lg bg-surface-base focus:bg-surface-card focus:border-indigo-500 transition-colors">
            </div>
            <div>
              <label class="block text-xs font-semibold text-text-muted mb-1">Phone</label>
              <input type="text" [(ngModel)]="form.footerPhone" (ngModelChange)="updatePreviewIframe()" class="w-full text-sm p-2.5 border border-border-card rounded-lg bg-surface-base focus:bg-surface-card focus:border-indigo-500 transition-colors">
            </div>
          </div>
        </section>

      </div>
    </div>

    <!-- Right Content (Live Preview) -->
    <div class="flex-1 bg-surface-base relative overflow-hidden flex flex-col p-4">
      <div class="bg-surface-card rounded-t-xl shadow-sm border-b border-border-card p-3 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2">
          <div class="flex gap-1.5 ml-2">
            <div class="w-3 h-3 rounded-full bg-red-400"></div>
            <div class="w-3 h-3 rounded-full bg-amber-400"></div>
            <div class="w-3 h-3 rounded-full bg-green-400"></div>
          </div>
          <div class="ml-4 text-xs font-medium text-text-muted flex items-center gap-1.5 bg-surface-base px-3 py-1 rounded-full">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            Live HTML Preview
          </div>
        </div>
      </div>
      
      <div class="flex-1 bg-surface-card shadow-lg overflow-hidden rounded-b-xl relative">
        <iframe id="figma-preview" 
                class="w-full h-full border-0 absolute inset-0"
                [srcdoc]="previewHtml">
        </iframe>
      </div>
    </div>
  </div>
</div>
