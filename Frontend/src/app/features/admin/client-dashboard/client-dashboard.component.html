<div class="p-8">
  <div class="mb-8">
    <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Client Dashboard</h1>
    <p class="text-gray-500 mt-2">Select a client below to quickly manage their website pages and content.</p>
  </div>

  <div *ngIf="loading" class="flex justify-center items-center py-20">
    <svg class="w-8 h-8 text-indigo-500 animate-spin" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
    </svg>
  </div>

  <div *ngIf="!loading && organizations.length === 0" class="bg-white p-12 rounded-2xl border-2 border-dashed border-gray-200 text-center">
    <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4 text-gray-400 text-2xl">
      🏢
    </div>
    <h3 class="text-lg font-bold text-gray-900 mb-1">No Clients Found</h3>
    <p class="text-sm text-gray-500">Go to Organizations to add your first client.</p>
  </div>

  <div *ngIf="!loading && organizations.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
    <div *ngFor="let org of organizations" 
      class="bg-white rounded-2xl border border-gray-200 shadow-sm hover:shadow-md hover:border-indigo-200 transition-all duration-200 overflow-hidden flex flex-col group">
      
      <!-- Card Header -->
      <div class="p-6 border-b border-gray-100 bg-gray-50/50 flex-1">
        <div class="flex items-start justify-between mb-4">
          <div class="w-12 h-12 rounded-xl bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold text-xl uppercase shadow-inner">
            {{ org.name.charAt(0) }}
          </div>
          <span [class]="org.isActive ? 'bg-emerald-50 text-emerald-600 border-emerald-200' : 'bg-gray-50 text-gray-500 border-gray-200'" 
            class="px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider border">
            {{ org.isActive ? 'Active' : 'Inactive' }}
          </span>
        </div>
        
        <h3 class="text-lg font-bold text-gray-900 mb-1 line-clamp-1" [title]="org.name">{{ org.name }}</h3>
        <p class="text-xs text-gray-500 font-mono bg-gray-100 px-2 py-1 rounded inline-block">{{ org.slug }}</p>
      </div>

      <!-- Card Action -->
      <button (click)="managePages(org.id)" 
        class="w-full p-4 flex items-center justify-center gap-2 text-sm font-bold text-indigo-600 bg-white hover:bg-indigo-50 transition-colors group-hover:text-indigo-700">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
        Manage Pages &amp; Content
      </button>

    </div>
  </div>
</div>
